name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Validate skills and manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Each step is a Makefile target, so `make check` on a laptop runs exactly
      # what CI runs. They are listed separately here only for better annotations.

      - name: Shell and Python syntax
        run: make shellcheck

      - name: Rebuild skills/ and fail if the committed output is stale
        run: make drift

      - name: Validate skills, frontmatter, cross-references and manifest versions
        run: make validate

      - name: Parse every host manifest
        run: make manifests

      - name: Install smoke test
        run: make smoke
